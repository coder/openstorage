\* Safety: two git pushes, two runners, a plain and a force push-upstream
\* call, three outages (enough to spend the retry budget) and two faults
\* (run crashes, failed finish writes, shutdown cancels, pushes that die
\* after their CAS). check.sh appends the code facts.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    QuietWriters = {}
    RestWriters = {}
    QuietRestWriters = {}
    Runners = {r1, r2}
    ApiCalls = {"plain", "force"}
    MaxRetries = 2
    MaxOutages = 3
    MaxFaults = 2
    WritesComplete = TRUE
    LeaseOutlivesRun = TRUE
INVARIANTS TypeOK NoLostForward ForceKept ExplicitNotDelayed BackoffKept NoRewind
