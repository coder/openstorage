\* Liveness under weak fairness: the lane always goes idle. Smaller bounds
\* than LaneSchedule.cfg keep the liveness check short.
SPECIFICATION FairSpec
CONSTANTS
    Writers = {w1, w2}
    QuietWriters = {}
    RestWriters = {}
    QuietRestWriters = {}
    Runners = {r1, r2}
    ApiCalls = {"plain", "force"}
    MaxRetries = 1
    MaxOutages = 1
    MaxFaults = 1
    WritesComplete = TRUE
    LeaseOutlivesRun = TRUE
PROPERTY Settles
