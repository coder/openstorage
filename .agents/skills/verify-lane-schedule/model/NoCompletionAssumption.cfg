\* Probe: drops the assumption that a git push whose authority CAS won lives
\* to record its intent and commit its cache ref. A hook or receive-pack
\* that dies after the CAS then loses the forward, so NoLostForward must fail.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Runners = {r1, r2}
    ApiCalls = {"plain", "force"}
    MaxRetries = 2
    MaxOutages = 3
    MaxFaults = 2
    PushCompletes = FALSE
    LeaseOutlivesRun = TRUE
INVARIANTS TypeOK NoLostForward ForceKept ExplicitNotDelayed BackoffKept NoRewind
