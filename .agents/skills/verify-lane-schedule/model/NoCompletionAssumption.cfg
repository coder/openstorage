\* Probe: drops the assumption that a writer whose authority CAS won also
\* records its intent. A hook or serve that dies, or a RequestPush that
\* fails, between the two then loses the forward, so NoLostForward must fail.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    QuietWriters = {}
    RestWriters = {}
    Runners = {r1, r2}
    ApiCalls = {"plain", "force"}
    MaxRetries = 2
    MaxOutages = 3
    MaxFaults = 2
    WritesComplete = FALSE
    HeldRefsFresh = TRUE
    LeaseOutlivesRun = TRUE
INVARIANTS TypeOK NoLostForward ForceKept ExplicitNotDelayed BackoffKept NoRewind
