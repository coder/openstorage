\* Probe: drops the assumption that a REST write whose authority CAS won
\* also records its intent. Serve dying, or a RequestPush that fails,
\* between the two then loses the forward, so NoLostForward must fail. Git
\* pushes record their intent before the CAS and need no such assumption.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1}
    QuietWriters = {}
    RestWriters = {x1}
    QuietRestWriters = {}
    Runners = {r1, r2}
    ApiCalls = {"plain", "force"}
    MaxRetries = 1
    MaxOutages = 1
    MaxFaults = 1
    WritesComplete = FALSE
    LeaseOutlivesRun = TRUE
INVARIANTS TypeOK NoLostForward ForceKept ExplicitNotDelayed BackoffKept NoRewind
