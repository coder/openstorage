\* Probe: drops the assumption that a push reserves its hold on a cache that
\* has every earlier write. A REST write changes only the authority, a push
\* whose advertisement predates it reserves the ref, and a run snapshots the
\* stale held ref and forwards it, so NoLostForward must fail, with no fault.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    QuietWriters = {w2}
    RestWriters = {x1}
    Runners = {r1, r2}
    ApiCalls = {"force"}
    MaxRetries = 1
    MaxOutages = 1
    MaxFaults = 0
    WritesComplete = TRUE
    HeldRefsFresh = FALSE
    LeaseOutlivesRun = TRUE
INVARIANTS TypeOK NoLostForward ForceKept ExplicitNotDelayed BackoffKept NoRewind
