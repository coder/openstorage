\* Probe: drops the timing assumption that a claim outlives its run. A
\* frozen forced run then rewinds the upstream, so NoRewind must fail.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    Runners = {r1, r2}
    ApiCalls = {"plain", "force"}
    MaxRetries = 2
    MaxOutages = 3
    MaxFaults = 2
    PushCompletes = TRUE
    LeaseOutlivesRun = FALSE
INVARIANTS TypeOK NoLostForward ForceKept ExplicitNotDelayed BackoffKept NoRewind
