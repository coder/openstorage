\* Safety with the other writers: a git push that records no intent (a
\* forward-denied token, or a sync run's loopback push) and a REST write,
\* next to a git push that records intent. Smaller bounds than
\* LaneSchedule.cfg keep the run short. check.sh appends the code facts.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    QuietWriters = {w2}
    RestWriters = {x1}
    Runners = {r1, r2}
    ApiCalls = {"force"}
    MaxRetries = 1
    MaxOutages = 1
    MaxFaults = 1
    WritesComplete = TRUE
    HeldRefsFresh = TRUE
    LeaseOutlivesRun = TRUE
INVARIANTS TypeOK NoLostForward ForceKept ExplicitNotDelayed BackoffKept NoRewind
