\* Safety with the other writers: a git push and a REST write that record no
\* intent (a forward-denied token, or a sync run's loopback push), next to a
\* git push and a REST write that do. Smaller bounds than LaneSchedule.cfg
\* keep the run short. check.sh appends the code facts.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    QuietWriters = {w2}
    RestWriters = {x1, x2}
    QuietRestWriters = {x2}
    Runners = {r1, r2}
    ApiCalls = {"force"}
    MaxRetries = 1
    MaxOutages = 1
    MaxFaults = 1
    LeaseOutlivesRun = TRUE
INVARIANTS TypeOK NoLostForward ForceKept ExplicitNotDelayed BackoffKept NoRewind
