\* Liveness: a registered pack with a missing blob gets its bytes back.
\* Smaller bounds than PackSweep.cfg: TLC checks liveness without symmetry.
\* check.sh appends the code facts before it runs.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1}
    Sweepers = {s1, s2}
    Nonces = {n1, n2}
    NoNonce = NoNonce
    MaxFaults = 1
    MaxFolds = 1
    WritesFinishWithinThreshold = TRUE
PROPERTY BytesComeBack
