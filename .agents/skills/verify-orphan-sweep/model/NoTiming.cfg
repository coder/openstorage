\* NoWaitForHeal with every timing guarantee off (WritesFinishWithinThreshold
\* and HealEntryBounded, pinned here over the code fact): the claim that the
\* post-delete recheck and the writer verify repair every race on the spot,
\* with no timing assumptions. Same bounds as PackSweep.cfg.
\* check.sh appends the code facts before it runs.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Sweepers = {s1, s2}
    Nonces = {n1, n2}
    NoNonce = NoNonce
    MaxFaults = 1
    MaxFolds = 1
    WritesFinishWithinThreshold = FALSE
    HealEntryBounded = FALSE
INVARIANT TypeOK
INVARIANT NoWaitForHeal
SYMMETRY SweepSymmetry
