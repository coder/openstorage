\* Safety: every interleaving of two writers and two sweepers on one key,
\* with up to two quarantine backups, one sweeper fault and one fold.
\* check.sh appends the code facts (a second CONSTANTS block) before it runs.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Sweepers = {s1, s2}
    Nonces = {n1, n2}
    NoNonce = NoNonce
    MaxFaults = 1
    MaxFolds = 1
    WritesFinishWithinThreshold = TRUE
INVARIANT TypeOK
INVARIANT NoLostPack
SYMMETRY SweepSymmetry
