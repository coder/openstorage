\* Self-test of RepoPurge.tla: with PurgeControl.cfg's bounds the model must
\* reach the stamp of a purge-repo run on an old repository that
\* CliUnreachable describes. check.sh expects CliUnreachable to be violated,
\* and appends the code facts before it runs.
SPECIFICATION Spec
CONSTANTS
    Writers = {}
    Purgers = {bg, cli}
    BgPurgers = {bg}
    Sweepers = {s1}
    Nonces = {n1, n2}
    NoNonce = NoNonce
    MaxFaults = 1
INVARIANT CliUnreachable
SYMMETRY PurgeSymmetry
VIEW View
