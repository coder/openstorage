\* Purge eligibility and the delete guard: the background purger and
\* purge-repo, one purge-aware sweeper, two quarantine slots, one fault, and
\* no writer. Writers reach the purgers' and the sweeper's control flow only
\* through K's row and bytes, and the initial states already hold every
\* value of those. check.sh appends the code facts before it runs.
SPECIFICATION Spec
CONSTANTS
    Writers = {}
    Purgers = {bg, cli}
    BgPurgers = {bg}
    Sweepers = {s1}
    Nonces = {n1, n2}
    NoNonce = NoNonce
    MaxFaults = 1
INVARIANT TypeOK
INVARIANT PurgeEligible
INVARIANT GuardRespected
SYMMETRY PurgeSymmetry
VIEW View
