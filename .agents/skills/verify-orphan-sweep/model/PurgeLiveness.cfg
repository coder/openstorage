\* Liveness of the repository purge: it completes and leaves no blob.
\* Smaller bounds than PurgeSafety.cfg: TLC checks liveness without
\* symmetry. check.sh appends the code facts before it runs.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1}
    Purgers = {bg, cli}
    BgPurgers = {bg}
    Sweepers = {s1}
    Nonces = {n1}
    NoNonce = NoNonce
    MaxFaults = 1
PROPERTY PurgeCompletes
