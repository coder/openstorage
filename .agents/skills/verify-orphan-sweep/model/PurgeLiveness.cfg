\* Liveness of the repository purge: it completes and the quarantine
\* drains. Smaller bounds than PurgeSafety.cfg: TLC checks liveness without
\* symmetry. Both timing assumptions are off: they only hold a backup's
\* aging back for a while, so a behavior with them in which time still
\* passes is a fair behavior without them, and the properties carry over.
\* check.sh appends the code facts before it runs.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1}
    Purgers = {bg, cli}
    BgPurgers = {bg}
    Sweepers = {s1}
    Nonces = {n1}
    NoNonce = NoNonce
    MaxFaults = 1
    WritesFinishWithinThreshold = FALSE
    HealEntryIsQuick = FALSE
PROPERTY PurgeCompletes
PROPERTY BackupsCollected
