\* Liveness of the repository purge: the quarantine backups that purges
\* and purge-aware sweeps make are collected.
\* Smaller bounds than PurgeSafety.cfg: TLC checks liveness without
\* symmetry. check.sh appends the code facts before it runs.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1}
    Purgers = {bg, cli}
    BgPurgers = {bg}
    Sweepers = {s1}
    Nonces = {n1}
    NoNonce = NoNonce
    MaxFaults = 1
PROPERTY BackupsCollected
