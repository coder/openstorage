\* Self-test of RepoPurge.tla: with PurgeSafety.cfg's bounds the model must
\* reach the purge race that RaceUnreachable describes. check.sh expects
\* RaceUnreachable to be violated, and appends the code facts before it runs.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Purgers = {bg, cli}
    BgPurgers = {bg}
    Sweepers = {s1}
    Nonces = {n1, n2}
    NoNonce = NoNonce
    MaxFaults = 1
INVARIANT RaceUnreachable
SYMMETRY PurgeSymmetry
VIEW View
