\* Rows and bytes under the purge: two writers, the background purger and
\* purge-repo, one purge-aware sweeper, two quarantine slots, one fault.
\* PackSweep's two timing assumptions hold. check.sh appends the code facts
\* before it runs.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Purgers = {bg, cli}
    BgPurgers = {bg}
    Sweepers = {s1}
    Nonces = {n1, n2}
    NoNonce = NoNonce
    MaxFaults = 1
    WritesFinishWithinThreshold = TRUE
    HealEntryIsQuick = TRUE
INVARIANT TypeOK
INVARIANT NoDanglingRow
INVARIANT StampedClean
SYMMETRY PurgeSymmetry
VIEW View
