\* Rows and bytes under the purge, and eligibility and the guard with
\* writers running: two writers, the background purger and
\* purge-repo, one purge-aware sweeper, two quarantine slots, one fault.
\* No timing assumption. check.sh appends the code facts before it runs.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Purgers = {bg, cli}
    BgPurgers = {bg}
    Sweepers = {s1}
    Nonces = {n1, n2}
    NoNonce = NoNonce
    MaxFaults = 1
INVARIANT TypeOK
INVARIANT NoDanglingRow
INVARIANT StampedClean
INVARIANT PurgeEligible
INVARIANT GuardRespected
SYMMETRY PurgeSymmetry
VIEW View
