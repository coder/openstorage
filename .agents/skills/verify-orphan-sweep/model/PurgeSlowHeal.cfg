\* Probe, expected to FAIL NoDanglingRow: let a heal stall between its
\* registry read and its age gate (HealEntryIsQuick = FALSE). check.sh
\* requires the violation; a pass means the code or the model changed.
\* check.sh appends the code facts before it runs.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Purgers = {bg, cli}
    BgPurgers = {bg}
    Sweepers = {s1}
    Nonces = {n1, n2}
    NoNonce = NoNonce
    MaxFaults = 1
    WritesFinishWithinThreshold = TRUE
    HealEntryIsQuick = FALSE
INVARIANT TypeOK
INVARIANT NoDanglingRow
SYMMETRY PurgeSymmetry
VIEW View
