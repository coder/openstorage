\* Probe, expected to FAIL NoLostPack: let a heal stall between its registry
\* read and its age gate, as if healQuarantineEntry had no deadline
\* (HealEntryBounded = FALSE, pinned here over the code fact). check.sh requires
\* the violation; a pass means the code or the model changed.
\* check.sh appends the code facts before it runs.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Sweepers = {s1, s2}
    Nonces = {n1, n2}
    NoNonce = NoNonce
    MaxFaults = 1
    MaxFolds = 1
    WritesFinishWithinThreshold = TRUE
    HealEntryBounded = FALSE
INVARIANT TypeOK
INVARIANT NoLostPack
SYMMETRY SweepSymmetry
