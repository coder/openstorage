# Nightly hot-path benchmark tracking (issue #92). Benchmarks are deliberately
# NOT a per-PR gate: shared-runner deltas are far too noisy to block merges
# on. This job produces a nightly data point (uploaded as an artifact) so
# regressions and optimizations (e.g. issue #93) can be compared across runs
# with benchstat. `-run '^$'` skips ordinary tests; CODESTORAGE_TEST_BACKEND=
# local keeps the internal/githttp TestMain boot container-free — the
# benchmarks themselves never touch the booted e2e environment.
name: bench-nightly

on:
  schedule:
    - cron: "23 4 * * *" # daily, 04:23 UTC (after dst-nightly and fuzz-nightly)
  workflow_dispatch:
    inputs:
      benchtime:
        description: "per-benchmark budget (go duration or Nx)"
        default: "1s"
      count:
        description: "repetitions per benchmark (benchstat wants >= 10)"
        default: "1"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: benchmark sweep
        # Explicit bash => pipefail: the tee must not mask a failing go test.
        shell: bash
        env:
          CODESTORAGE_TEST_BACKEND: local
        run: |
          BENCHTIME="${{ github.event.inputs.benchtime }}"
          COUNT="${{ github.event.inputs.count }}"
          BENCHTIME="${BENCHTIME:-1s}"
          COUNT="${COUNT:-1}"
          echo "sweep: benchtime=$BENCHTIME count=$COUNT"
          go test ./... -run '^$' -bench . -benchmem -benchtime "$BENCHTIME" -count "$COUNT" -timeout 50m | tee bench-results.txt
      - name: upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: bench-results.txt
          if-no-files-found: warn
