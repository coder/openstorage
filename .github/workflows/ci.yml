# Merge gate for coder/openstorage (issue #7): lint, build, and the full
# uncached race test suite. Postgres-dependent tests (river jobs, pg ref CAS,
# githttp e2e pg lane) boot their own postgres/seaweedfs containers via
# testcontainers, so they only need Docker on the runner — no service
# containers. The local lane covers the zero-container sqlite+fileblob e2e
# tests that are skipped in the default pg lane; the s3wal lane covers the
# zero-infra serve path (bucket-only authority) that was nightly-only before
# issue #193.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # mise.toml is the single source of truth for the Go and golangci-lint
      # pins; install both here so CI lints with exactly the local toolchain.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: golangci-lint run

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The LFS e2e tests silently skip when git-lfs is missing; assert it is
      # installed so the suite cannot quietly lose coverage.
      - run: git lfs version
      - run: go build ./...
      # Cross-compile every release target so platform-specific syscall
      # types (e.g. Stat_t.Dev: int32 on darwin, uint64 on linux) break PR
      # CI instead of the tag-time release asset build (v0.14.4 incident).
      - name: Cross-compile release targets
        run: |
          for os in darwin linux; do
            for arch in amd64 arm64; do
              echo "building $os/$arch"
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./...
            done
          done
      - run: go test ./... -count=1 -race -timeout=30m

  # Build-only image smoke test (no push, no registry): verify-sig ref
  # policies shell out through git to `gpg` (PGP) and `ssh-keygen` (SSH) at
  # push time and fail closed when the binary is absent (ADR-9, #50), and the
  # server hard-requires external `git`. Assert the runtime image keeps
  # shipping all three so a base-image or package-list change cannot silently
  # regress signed pushes.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t ghcr.io/coder/openstorage:smoke .
      - run: docker run --rm --entrypoint /bin/sh ghcr.io/coder/openstorage:smoke -c 'command -v git && command -v gpg && command -v ssh-keygen'

  test-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: git lfs version
      - run: go test ./internal/githttp -count=1 -race -timeout=15m
        env:
          OPENSTORAGE_TEST_BACKEND: local

  # The s3wal serve/e2e lane (issue #193; promotion tracking #192, item B1):
  # internal/githttp's TestMain boots the zero-infra topology — one SeaweedFS
  # bucket (testcontainer) carrying the s3wal ref+meta authority (_wal/) AND
  # the packs/LFS blobs — and drives real `git` against child serve
  # processes: the full shared e2e suite plus the lane-only drills
  # (restart-from-bucket, SIGTERM lease release, dual-serve refusal).
  # Scoped to ./internal/githttp deliberately: that TestMain is the only
  # consumer of OPENSTORAGE_TEST_BACKEND, so a full ./... run under this
  # lane would replay every other package byte-identically with the `test`
  # job above (the s3wal CAS/qualification suites in internal/ref/s3wal and
  # the MemCAS-backed s3wal meta suite in internal/meta already run there
  # unconditionally). The harness itself exports OPENSTORAGE_S3WAL_LEASE_TTL=0
  # to its serve children (many serve processes legitimately share the one
  # lane bucket); the job only selects the lane.
  test-s3wal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: git lfs version
      - run: go test ./internal/githttp -count=1 -race -timeout=25m
        env:
          OPENSTORAGE_TEST_BACKEND: s3wal
