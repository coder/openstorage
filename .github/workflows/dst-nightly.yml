# Nightly extended sweep for the deterministic simulation harness (issue
# #3). The PR pipeline already runs the fast seeded lane (TestDSTFast et al.
# inside the ci `test` job); this workflow explores many more seeds with
# longer runs. The seed base is derived from the run id, so every night
# covers fresh seeds while staying reproducible from the log: any reported
# failure names the exact seed + step count to replay locally with
# `go run ./cmd/dst -seed <seed> -v` or DST_SEED=<seed> go test.
name: dst-nightly

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
    inputs:
      seeds:
        description: "number of seeds to sweep"
        default: "48"
      base:
        description: "seed base (empty = derived from run id)"
        default: ""
      steps:
        description: "scheduler steps per seed"
        default: "300"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: extended seed sweep
        run: |
          BASE="${{ github.event.inputs.base }}"
          if [ -z "$BASE" ]; then
            BASE=$(( ${{ github.run_id }} % 1000000000 ))
          fi
          SEEDS="${{ github.event.inputs.seeds }}"
          STEPS="${{ github.event.inputs.steps }}"
          echo "sweep: base=$BASE seeds=${SEEDS:-48} steps=${STEPS:-300}"
          DST_SWEEP_BASE="$BASE" \
          DST_SWEEP_SEEDS="${SEEDS:-48}" \
          DST_STEPS="${STEPS:-300}" \
            go test ./internal/simtest -count=1 -race -run 'TestDSTSweep' -v -timeout=110m
