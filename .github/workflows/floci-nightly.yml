# Nightly S3 lane against Floci (issue #112). The PR pipeline's S3-over-HTTP
# coverage is the SeaweedFS testcontainer lane inside `go test ./internal/blob`;
# this workflow additionally boots floci/floci — a lightweight AWS
# wire-protocol emulator — with FLOCI_SERVICES_S3_ENFORCE_AUTH=true,
# provisions an IAM access key through the IAM API, and runs the blob suite
# with OPENSTORAGE_TEST_S3_URL pointed at it. That gates the env-gated
# endpoint tests (internal/blob/s3endpoint_test.go), which pin real SigV4
# verification on presigned URLs: valid signature ⇒ 200 + exact bytes,
# corrupted signature ⇒ 403 SignatureDoesNotMatch. Releases 2.1.0 and
# 2.2.0 also reject wrong header-auth secrets and invalid temporary-session
# tokens in the GetObject probes. Remaining gaps on this pin: an explicit
# IAM Deny s3:GetObject does not deny reads and x-amz-expected-bucket-owner
# is ignored. Do not use this lane to assert those properties. 2.2.0
# honors DeleteObject+If-Match (412). The release includes the torn-read
# fix (floci-io/floci#2874 and #2901). A second job runs the Floci row of the
# s3wal qualification matrix. Full gap list + local repro:
# docs/reference/testing.md (The Floci S3 lane).
name: floci-nightly

on:
  schedule:
    - cron: "53 3 * * *" # daily, 03:53 UTC (between dst-nightly and bench-nightly)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s3-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: boot floci
        # Keep this OCI index digest in sync with s3waltest.FlociImage and
        # floci-nightly-githttp.yml so every lane tests the qualified release.
        run: |
          docker run -d --name floci -p 4566:4566 \
            -e FLOCI_SERVICES_S3_ENFORCE_AUTH=true \
            floci/floci:2.2.0@sha256:e97cd0c1dc2aa14e7697fb5ef5018404c4d6345169dbd276315f0bed2c7b0520
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:4566/; then
              echo "floci ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::floci did not become ready"
          docker logs floci
          exit 1
      - name: provision IAM access key
        # The IAM control plane accepts any credentials; only the S3 data
        # plane enforces auth. It honors keys minted through IAM (plus
        # Floci's built-in test key, which this lane never uses).
        env:
          AWS_ACCESS_KEY_ID: root
          AWS_SECRET_ACCESS_KEY: root
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws --endpoint-url http://127.0.0.1:4566 iam create-user --user-name blob-nightly
          key_json=$(aws --endpoint-url http://127.0.0.1:4566 iam create-access-key \
            --user-name blob-nightly --output json)
          access_key_id=$(jq -r '.AccessKey.AccessKeyId // empty' <<<"$key_json")
          secret_key=$(jq -r '.AccessKey.SecretAccessKey // empty' <<<"$key_json")
          # API responses remain untrusted even with a digest-pinned image:
          # full-string-validate both values before writing them to
          # GITHUB_ENV — an embedded newline would otherwise inject extra
          # variables (e.g. GOCACHEPROG) into every later step. Bash [[ =~ ]]
          # anchors span the whole string, so newlines cannot hide inside.
          if [[ ! "$access_key_id" =~ ^[A-Z0-9]{16,32}$ ]] || [[ ! "$secret_key" =~ ^[A-Za-z0-9/+=]{20,64}$ ]]; then
            echo "::error::IAM CreateAccessKey returned missing or malformed credentials"
            exit 1
          fi
          {
            echo "AWS_ACCESS_KEY_ID=$access_key_id"
            echo "AWS_SECRET_ACCESS_KEY=$secret_key"
          } >> "$GITHUB_ENV"
      - name: blob suite with the endpoint tests against floci
        shell: bash # explicit: pipefail so the tee cannot mask go test's exit code
        env:
          AWS_REGION: us-east-1
          OPENSTORAGE_TEST_S3_URL: s3://openstorage-nightly?endpoint=http://127.0.0.1:4566&s3ForcePathStyle=true&region=us-east-1
        run: |
          go test ./internal/blob -count=1 -race -v -timeout=25m 2>&1 | tee /tmp/floci-lane.log
      - name: assert the endpoint tests ran (a skip means broken env plumbing)
        run: |
          for t in TestS3Endpoint_RoundTrip TestS3Endpoint_PresignedSigV4; do
            if ! grep -q "^--- PASS: $t" /tmp/floci-lane.log; then
              echo "::error::$t did not run against floci (renamed gate or broken env plumbing?)"
              exit 1
            fi
          done
      - name: floci logs
        if: failure()
        run: docker logs floci

  # Floci row of the s3wal qualification matrix (issues #205, #212):
  # TestQualifyFloci boots the PINNED s3waltest.FlociImage via
  # testcontainers and logs one VERDICT line per surface. The 22 standard
  # qualification surfaces and get-under-overwrite (GET atomicity under
  # same-key overwrite — s3wal's production read-vs-CAS shape) run in
  # REQUIRE mode: the pinned build passes them since upstream fixed the
  # torn-read bug (floci-io/floci#2874), so a regression fails this job.
  # delete-if-match stays record-only (2.2.0 honors it, but s3wal
  # never relies on it — ADR-46). Second-implementation regression armor
  # only — not #192 promotion evidence. TestQualifyFloci is not env-gated,
  # so it also runs wherever `go test ./...` runs (the per-PR `test` job
  # included), exactly as the record-mode row did; this nightly job is
  # where the VERDICT transcript is asserted complete.
  s3wal-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Floci qualification row (22 surfaces + get-under-overwrite required, delete-if-match recorded)
        shell: bash # explicit: pipefail so the tee cannot mask go test's exit code
        run: |
          go test ./internal/ref/s3wal -run 'TestQualifyFloci$' -count=1 -v -timeout=25m 2>&1 | tee /tmp/s3wal-qualify-floci.log
      - name: assert the row is complete (a skip or renamed surface means broken plumbing)
        run: |
          if ! grep -q "^--- PASS: TestQualifyFloci" /tmp/s3wal-qualify-floci.log; then
            echo "::error::TestQualifyFloci did not run to a PASS (renamed gate or broken plumbing?)"
            exit 1
          fi
          for surface in delete-if-match get-under-overwrite; do
            if ! grep -q "surface=$surface verdict=" /tmp/s3wal-qualify-floci.log; then
              echo "::error::no VERDICT line for $surface — the record row is incomplete"
              exit 1
            fi
          done
