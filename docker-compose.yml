# Local infra for codestorage: Postgres (ref authority + metadata) and MinIO
# (immutable pack storage). The service itself runs on the host:
#   go run ./cmd/codestorage serve   (see README.md quickstart)
#
# Host ports are env-overridable because sibling checkouts/agents may share
# the docker daemon; pick a unique compose project name too:
#   PGPORT=15499 MINIOPORT=19499 docker compose -p codestorage-$(whoami) up -d --wait
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "${PGPORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIOPORT:-19000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 15
