# Local infra for codestorage: Postgres (ref authority + metadata) and MinIO
# (immutable pack storage). The service itself runs on the host:
#   go run ./cmd/codestorage serve   (see README.md quickstart)
#
# Host ports are env-overridable because sibling checkouts/agents may share
# the docker daemon; pick a unique compose project name too:
#   PGPORT=15499 MINIOPORT=19499 docker compose -p codestorage-$(whoami) up -d --wait
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "${PGPORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIOPORT:-19000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Opt-in two-replica app profile (`docker compose --profile replicas up`):
  # two stateless nodes on the same Postgres+MinIO stack, proving multi-node
  # statelessness in the README quickstart. Default `docker compose up` still
  # boots only the backing services above. The nodes are identical except the
  # host port mapping (and the base URL that embeds it). Keys come from the
  # host (`./codestorage keygen --out ./compose-keys/cs-key`, see README).
  node-a: &node
    build: .
    profiles: ["replicas"]
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: &node-env
      CODESTORAGE_PG_URL: postgres://postgres:postgres@postgres:5432/postgres
      CODESTORAGE_S3_URL: "s3://codestorage?endpoint=http://minio:9000&s3ForcePathStyle=true&region=us-east-1"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      CODESTORAGE_ORG: selfhost
      CODESTORAGE_ORG_PUBKEYS: /keys/cs-key.pub.pem
      CODESTORAGE_LISTEN: 0.0.0.0:8080
      CODESTORAGE_BASE_URL: http://127.0.0.1:${NODEA_PORT:-8081}
    ports:
      - "${NODEA_PORT:-8081}:8080"
    volumes:
      - ${CS_KEYS_DIR:-./compose-keys}:/keys:ro
    healthcheck:
      # /healthz is unauthenticated; wget is busybox, present in the alpine
      # runtime image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
  node-b:
    <<: *node
    environment:
      <<: *node-env
      CODESTORAGE_BASE_URL: http://127.0.0.1:${NODEB_PORT:-8082}
    ports:
      - "${NODEB_PORT:-8082}:8080"
