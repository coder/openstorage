# Local infra for codestorage: Postgres (ref authority + metadata) and
# SeaweedFS (immutable pack storage via its S3 gateway; the tested reference
# self-hosted store — issue #133). The service itself runs on the host:
#   go run ./cmd/codestorage serve   (see README.md quickstart)
#
# Host ports are env-overridable because sibling checkouts/agents may share
# the docker daemon; pick a unique compose project name too:
#   PGPORT=15499 S3PORT=18499 docker compose -p codestorage-$(whoami) up -d --wait
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "${PGPORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
  seaweedfs:
    # Qualified recipe (issue #133 Gate 1a-A, PR #142): pinned image,
    # one-process `weed server -s3`, anonymous auth (clients still need
    # non-empty dummy AWS credentials for SigV4 signing). Never enable
    # versioning or object-lock on data buckets (seaweedfs#8073 avoidance).
    image: chrislusf/seaweedfs:4.42
    command: server -s3 -dir=/data -ip.bind=0.0.0.0
    ports:
      - "${S3PORT:-18333}:8333"
    healthcheck:
      # An anonymous ListBuckets against the S3 gateway: it 200s only once
      # the filer chain behind the gateway can actually serve (the port
      # accepts TCP well before that).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Opt-in two-replica app profile (`docker compose --profile replicas up`):
  # two stateless nodes on the same Postgres+SeaweedFS stack, proving
  # multi-node statelessness in the README quickstart. Default
  # `docker compose up` still boots only the backing services above. The
  # nodes are identical except the host port mapping (and the base URL that
  # embeds it). Keys come from the host
  # (`./codestorage keygen --out ./compose-keys/cs-key`, see README).
  node-a: &node
    build: .
    profiles: ["replicas"]
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment: &node-env
      CODESTORAGE_PG_URL: postgres://postgres:postgres@postgres:5432/postgres
      CODESTORAGE_S3_URL: "s3://codestorage?endpoint=http://seaweedfs:8333&s3ForcePathStyle=true&region=us-east-1"
      # The gateway is anonymous; the SDK just needs non-empty credentials.
      AWS_ACCESS_KEY_ID: codestorage
      AWS_SECRET_ACCESS_KEY: codestorage
      CODESTORAGE_ORG: selfhost
      CODESTORAGE_ORG_PUBKEYS: /keys/cs-key.pub.pem
      CODESTORAGE_LISTEN: 0.0.0.0:8080
      CODESTORAGE_BASE_URL: http://127.0.0.1:${NODEA_PORT:-8081}
    ports:
      - "${NODEA_PORT:-8081}:8080"
    volumes:
      # Only the PUBLIC half: the private key stays on the host for minting.
      - ${CS_KEYS_DIR:-./compose-keys}/cs-key.pub.pem:/keys/cs-key.pub.pem:ro
    healthcheck:
      # /healthz is unauthenticated; wget is busybox, present in the alpine
      # runtime image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
  node-b:
    <<: *node
    environment:
      <<: *node-env
      CODESTORAGE_BASE_URL: http://127.0.0.1:${NODEB_PORT:-8082}
    ports:
      - "${NODEB_PORT:-8082}:8080"
