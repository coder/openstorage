              contentSchema:
                maxItems: 1
                minItems: 1
                prefixItems:
                  - additionalProperties: false
                    properties:
                      metadata:
                        $ref: "#/components/schemas/ReposCommitsRestoreRequest"
                    required:
                      - metadata
                    type: object
                type: array
              description: NDJSON stream containing one `metadata` object.
              type: string
        description: Send a single NDJSON metadata line describing the branch to restore and the commit SHA to restore it to. The handler requires this line and rejects an empty body with `400`, even though the published contract leaves it optional.
