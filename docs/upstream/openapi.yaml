servers:
  - description: Code Storage API host for your organization
    url: https://api.{org}.code.storage
    variables:
      org:
        default: your-org
        description: The subdomain of your API host. It is usually your organization name. The organization settings page in the dashboard shows your exact API host.
tags:
  - description: Create, inspect, update, delete, and synchronise repositories, including upstream pull-sync and generic HTTPS Git credentials for non-GitHub upstreams.
    name: Repositories
  - description: Create, delete, list, and compare branches.
    name: Branches
  - description: Read commit metadata and diffs, or create commits without a local Git client.
    name: Commits
  - description: Read repository trees, file contents, archives, and server-side search results.
    name: Files
  - description: List, create, and delete Git tags.
    name: Tags
  - description: Attach and retrieve Git notes for commits or other Git objects.
    name: Notes
  - description: Read metadata about the Code Storage cluster that serves your organisation, such as its cloud location and inbound IP addresses.
    name: Organization
webhooks:
  push:
    post:
      description: Sent when a Git ref is updated in a repository. Each updated ref produces a separate event.
      operationId: webhooks-push
      parameters:
        - description: The event type for this delivery.
          in: header
          name: X-Pierre-Event
          required: true
          schema:
            enum:
              - push
            type: string
        - description: Signature in the form t=<unix_timestamp>,sha256=<hex_signature>. Verify HMAC-SHA256 with the subscription secret over the timestamp, a period, and the raw request body. Check the timestamp to reject old deliveries.
          in: header
          name: X-Pierre-Signature
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitPushEvent"
        description: The push event payload.
        required: true
      responses:
        2XX:
          description: The receiver accepted the delivery. Return any 2xx status to acknowledge it.
      security: []
      summary: Git ref updated
      tags:
        - Webhooks
  repo.sync.failed:
    post:
      description: Sent when a repository sync run fails, including failures after retries are exhausted and infrastructure failures. Internal cancellations do not produce this event. run_count includes the run that just finished.
      operationId: webhooks-repo-sync-failed
      parameters:
        - description: The event type for this delivery.
          in: header
          name: X-Pierre-Event
          required: true
          schema:
            enum:
              - repo.sync.failed
            type: string
        - description: Signature in the form t=<unix_timestamp>,sha256=<hex_signature>. Verify HMAC-SHA256 with the subscription secret over the timestamp, a period, and the raw request body. Check the timestamp to reject old deliveries.
          in: header
          name: X-Pierre-Signature
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitSyncFailedEvent"
        description: The repo.sync.failed event payload.
        required: true
      responses:
        2XX:
          description: The receiver accepted the delivery. Return any 2xx status to acknowledge it.
      security: []
      summary: Repository sync failed
      tags:
        - Webhooks
  repo.sync.started:
    post:
      description: Sent when a repository sync run begins, before the upstream fetch starts. run_count counts previously completed runs.
      operationId: webhooks-repo-sync-started
      parameters:
        - description: The event type for this delivery.
          in: header
          name: X-Pierre-Event
          required: true
          schema:
            enum:
              - repo.sync.started
            type: string
        - description: Signature in the form t=<unix_timestamp>,sha256=<hex_signature>. Verify HMAC-SHA256 with the subscription secret over the timestamp, a period, and the raw request body. Check the timestamp to reject old deliveries.
          in: header
          name: X-Pierre-Signature
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitSyncStartedEvent"
        description: The repo.sync.started event payload.
        required: true
      responses:
        2XX:
          description: The receiver accepted the delivery. Return any 2xx status to acknowledge it.
      security: []
      summary: Repository sync started
      tags:
        - Webhooks
  repo.sync.succeeded:
    post:
      description: Sent when a repository sync run completes successfully. run_count includes the run that just finished.
      operationId: webhooks-repo-sync-succeeded
      parameters:
        - description: The event type for this delivery.
          in: header
          name: X-Pierre-Event
          required: true
          schema:
            enum:
              - repo.sync.succeeded
            type: string
        - description: Signature in the form t=<unix_timestamp>,sha256=<hex_signature>. Verify HMAC-SHA256 with the subscription secret over the timestamp, a period, and the raw request body. Check the timestamp to reject old deliveries.
          in: header
          name: X-Pierre-Signature
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitSyncSucceededEvent"
        description: The repo.sync.succeeded event payload.
        required: true
      responses:
        2XX:
          description: The receiver accepted the delivery. Return any 2xx status to acknowledge it.
      security: []
      summary: Repository sync succeeded
      tags:
        - Webhooks
