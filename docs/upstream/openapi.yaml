          description: Optional branch tip guard. The merge fails if the target has moved since this SHA.
          examples:
            - c4f0fdfc41adab56630b34f5f4fd4e84a2c5b4d2
          type: string
        source_branch:
          deprecated: true
          description: "Deprecated: use source_ref. Source branch to merge from."
