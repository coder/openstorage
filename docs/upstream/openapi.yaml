components:
  schemas:
    ArchiveOptions:
      additionalProperties: false
      description: Output settings for an archive, such as a prefix for every file path.
      properties:
        prefix:
          description: Prefix to add to every file path inside the archive.
          type: string
      type: object
    BaseRepo:
      additionalProperties: false
      description: Code Storage repository that a new repository copies once. The deprecated form, with provider and operation, also describes a sync or a fork.
      properties:
        auth:
          $ref: "#/components/schemas/BaseRepoAuth"
          description: Authentication for the source repository. A copy requires auth.token.
        default_branch:
          deprecated: true
          description: "Deprecated: use the top-level default_branch for a copy or a sync."
          type: string
        name:
          description: Name of the Code Storage repository to copy. In the deprecated form, the repository name on the provider.
          examples:
            - templates/starter
          type: string
        operation:
          default: sync
          deprecated: true
          description: "Deprecated: base_repo without provider is a copy, and upstream is a sync. In the deprecated form, sync (the default) or fork."
          enum:
            - sync
            - fork
          type: string
        owner:
          deprecated: true
          description: "Deprecated: omit it for a copy, and use upstream.owner for a sync."
          type: string
        provider:
          deprecated: true
          description: "Deprecated: omit it for a copy, and use upstream for a sync. In the deprecated form, the provider of the source."
          enum:
            - github
            - gitlab
            - bitbucket
            - gitea
            - forgejo
            - codeberg
            - sr.ht
            - sourcehut
            - code.storage
          type: string
        ref:
          description: Branch, tag, or commit SHA to copy. It defaults to the HEAD of the source repository.
          examples:
            - main
          type: string
        sha:
          deprecated: true
          description: "Deprecated: use ref, which accepts a commit SHA."
          type: string
        upstream_host:
          deprecated: true
          description: "Deprecated: use upstream.host."
          type: string
      required:
        - name
      type: object
    BaseRepoAuth:
      additionalProperties: false
      description: Authentication used to access the base repository for sync or fork operations.
      properties:
        auth_type:
          deprecated: true
          description: "Deprecated: use upstream.access for a public GitHub sync. A copy needs no auth_type."
          enum:
            - public
            - jwt
          type: string
        token:
          description: JWT with git:read on the source repository. A copy requires it.
          type: string
      type: object
    BlameLine:
      additionalProperties: false
      description: Single blame entry describing the commit and author responsible for a line.
      properties:
        author_email:
          description: Author email of the commit that last touched this line.
          examples:
            - jane@example.com
          type: string
        author_name:
          description: Author of the commit that last touched this line.
          examples:
            - Jane Doe
          type: string
        author_time:
          description: Author timestamp in RFC 3339 format.
          examples:
            - "2024-01-15T14:32:18Z"
          type: string
        commit_sha:
          description: Commit SHA that last touched this line.
          examples:
            - b003fc78805954584e1ee364a4ad39d7c79e819a
          type: string
        committer_email:
          description: Committer email of the commit that last touched this line.
          examples:
            - jane@example.com
          type: string
        committer_name:
          description: Committer of the commit that last touched this line.
          examples:
            - Jane Doe
          type: string
        committer_time:
          description: Committer timestamp in RFC 3339 format.
          examples:
            - "2024-01-15T14:32:18Z"
          type: string
        line_number:
          description: Line number in the current file.
          examples:
            - 42
          format: int32
          type: integer
        original_line_number:
          description: Line number in the original file before any renames or moves.
          examples:
            - 40
          format: int32
          type: integer
        original_path:
          description: Original repository-relative path the line was introduced at.
          examples:
            - src/main.go
          type: string
        previous_commit_sha:
          description: Commit SHA prior to the current commit when known.
          examples:
            - a4d39d7c79e819ab003fc78805954584e1ee36
          type: string
        summary:
          description: First line of the commit message.
          examples:
            - "fix: resolve scrolling issue in dashboard"
          type: string
      required:
        - line_number
        - commit_sha
        - original_line_number
        - original_path
        - author_name
        - author_email
        - author_time
        - committer_name
        - committer_email
        - committer_time
        - summary
      type: object
    BlobChunk:
      additionalProperties: false
      description: Part of the content of one file in a create-commit NDJSON body. Send the chunks of a file in order, and set `eof` on the last one.
      properties:
        content_id:
          description: Ties the chunk to a file operation.
          type: string
        data:
          description: Base64-encoded payload (decoded payload must be at most 4 MiB per chunk).
          type: string
        eof:
          description: Set true on the final chunk for that content_id.
          type: boolean
      required:
        - content_id
        - data
        - eof
      type: object
    Branch:
      description: A branch.
      properties:
        created_at:
          description: ISO 8601 creation timestamp.
          examples:
            - "2024-01-15T10:30:00Z"
          type: string
        head_sha:
          description: HEAD commit SHA for the branch.
          examples:
            - a1b2c3d4e5f6
          type: string
        name:
          description: Branch name.
          examples:
            - main
          type: string
      required:
        - name
        - head_sha
        - created_at
      type: object
    BranchListItem:
      allOf:
        - $ref: "#/components/schemas/Branch"
        - properties:
            cursor:
              description: Opaque pagination token for this branch entry.
              examples:
                - b_123abc
              type: string
          required:
            - cursor
          type: object
      description: A branch in a list, with its pagination cursor.
      type: object
    Commit:
      additionalProperties: false
      description: Commit metadata. For a signed commit, repos.commits.get also returns the armored signature and the signed payload.
      properties:
        author_email:
          description: Commit author email.
          examples:
            - jane@example.com
          type: string
        author_name:
          description: Commit author name.
          examples:
            - Jane Doe
          type: string
        committer_email:
          description: Commit committer email.
          examples:
            - jane@example.com
          type: string
        committer_name:
          description: Commit committer name.
          examples:
            - Jane Doe
          type: string
        date:
          description: Commit timestamp in RFC 3339 format.
          examples:
            - "2024-01-15T14:32:18Z"
          type: string
        message:
          description: The commit message.
          examples:
            - "fix: resolve scrolling issue in dashboard"
          type: string
        parent_shas:
          description: Parent commit SHAs in Git parent order. Empty for root commits.
          examples:
            - - f4f9df3b8db66c73f6bf67e8f8f4f14f6522731e
          items:
            type: string
          type: array
        payload:
          description: "The signed payload: the raw commit object with the gpgsig header removed. This is the exact data the signature is computed over. Present in repos.commits.get responses when the commit is signed."
          type: string
        sha:
          description: The commit SHA.
          examples:
            - b003fc78805954584e1ee364a4ad39d7c79e819a
          type: string
        signature:
          description: Armored signature from the commit's gpgsig header (OpenPGP or SSH). Present in repos.commits.get responses when the commit is signed.
          examples:
            - |
              -----BEGIN PGP SIGNATURE-----
              ...
              -----END PGP SIGNATURE-----
          type: string
      required:
        - sha
        - parent_shas
        - message
        - author_name
        - author_email
        - committer_name
        - committer_email
        - date
      type: object
    CommitWriteResponse:
      additionalProperties: false
      description: Result of applying an NDJSON commit pack, including the resulting commit and branch update.
      properties:
        commit:
          $ref: "#/components/schemas/WrittenCommit"
          description: Commit object information generated by the storage service.
        result:
          $ref: "#/components/schemas/RefUpdateResult"
          description: Final branch update outcome.
      required:
        - commit
        - result
      type: object
    DiffChunk:
      additionalProperties: false
      description: Part of the Git patch in a create-commit-from-diff NDJSON body. Send the chunks in order, and set `eof` on the last one.
      properties:
        data:
          description: Base64-encoded diff bytes. Decoded payloads must be at most 4 MiB. Combined diff must be compatible with git apply --cached --binary.
          type: string
        eof:
          description: Set true on the final chunk to signal end-of-stream.
          type: boolean
      required:
        - data
        - eof
      type: object
    DiffStats:
      additionalProperties: false
      description: Aggregate diff statistics across all files.
      properties:
        additions:
          description: Total added lines across the diff.
          examples:
            - 50
          format: int64
          type: integer
        changes:
          description: Total line changes (additions plus deletions).
          examples:
            - 60
          format: int64
          type: integer
        deletions:
          description: Total deleted lines across the diff.
          examples:
            - 10
          format: int64
          type: integer
        files:
          description: Number of files changed.
          examples:
            - 3
          format: int64
          type: integer
      required:
        - files
        - additions
        - deletions
        - changes
      type: object
    FileDiff:
      additionalProperties: false
      description: Per-file diff entry including the raw unified diff text.
      properties:
        additions:
          description: Added lines in this file.
          format: int64
          type: integer
        bytes:
          description: File size in bytes.
          examples:
            - 2048
          format: int64
          type: integer
        deletions:
          description: Deleted lines in this file.
          format: int64
          type: integer
        is_eof:
          description: Whether the file ends with a newline.
          examples:
            - true
          type: boolean
        old_path:
          description: Previous file path for renamed files.
          type: string
        path:
          description: Repository-relative file path (new location for renames).
          examples:
            - src/main.go
          type: string
        raw:
          description: Raw unified diff content.
          examples:
            - |-
              diff --git a/src/main.go b/src/main.go
              ...
          type: string
        state:
          description: "Git status code: A (added), M (modified), D (deleted), R (renamed), C (copied), or T (type changed)."
          examples:
            - M
          type: string
      required:
        - path
        - state
        - raw
        - bytes
        - is_eof
        - additions
        - deletions
      type: object
    FileEntry:
      additionalProperties: false
      description: Tree entry in a list-files response, including the repository-rooted path, six-digit Git mode, and derived type.
      properties:
        mode:
          description: Six-digit Git mode for the entry.
          examples:
            - "100644"
          type: string
        path:
          description: Repository-rooted path.
          examples:
            - src/main.go
          type: string
        type:
          description: "Entry type: blob, tree, symlink, or submodule."
          examples:
            - blob
          type: string
      required:
        - path
        - type
        - mode
      type: object
    FileLastCommit:
      additionalProperties: false
      description: Commit metadata shared by one or more files in a list-files-with-metadata response.
      properties:
        author:
          description: Author display name for the commit.
          examples:
            - Jon Crosby
          type: string
        date:
          description: RFC 3339 author date for the commit.
          examples:
            - "2026-02-18T10:30:00Z"
          type: string
        message:
          description: Commit message.
          examples:
            - add list files with metadata endpoint
          type: string
        order:
          description: "History-order rank relative to the resolved ref: 0 is the commit closest to the ref tip (newest in history), larger values are older. Derived from a topological walk rather than author dates, so callers can rank a folder's latest change by the smallest order among its files."
          examples:
            - 0
          format: int32
          type: integer
      required:
        - author
        - date
        - message
        - order
      type: object
    FileOperation:
      additionalProperties: false
      description: A file that a commit adds, replaces, or deletes.
      properties:
        content_id:
          description: Identifier that blob chunks reference for this file. Required for upsert.
          type: string
        mode:
          description: File mode such as 100644 or 100755. Defaults to 100644.
          type: string
        operation:
          description: upsert (default) to add or replace content, or delete to remove a file.
          type: string
        path:
          description: Repository-relative path, with no leading slash.
          type: string
      required:
        - path
      type: object
    FileWithMetadata:
      additionalProperties: false
      description: File entry in a list-files-with-metadata response, including mode, type, and the SHA of the most recent commit that touched it.
      properties:
        last_commit_sha:
          description: Commit SHA of the most recent commit that touched this file.
          examples:
            - a1b2c3d4e5f6
          type: string
        mode:
          description: File mode as stored in Git, for example 100644.
          examples:
            - "100644"
          type: string
        path:
          description: Repository-relative file path.
          examples:
            - README.md
          type: string
        size:
          description: File size in bytes.
          examples:
            - 2048
          format: int64
          type: integer
        type:
          description: "Derived file type: blob, tree, symlink, or submodule."
          examples:
            - blob
          type: string
      required:
        - path
        - mode
        - type
        - size
        - last_commit_sha
      type: object
    FilteredFile:
      additionalProperties: false
      description: Per-file diff entry that was excluded from inline diff output because of size or file-type rules.
      properties:
        bytes:
          description: File size in bytes.
          examples:
            - 50000
          format: int64
          type: integer
        is_eof:
          description: Whether the file ends with a newline.
          examples:
            - true
          type: boolean
        old_path:
          description: Previous file path for renamed files.
          type: string
        path:
          description: Repository-relative file path (new location for renames). Excluded from inline diff content because of size or file-type rules.
          examples:
            - package-lock.json
          type: string
        state:
          description: "Git status code: A (added), M (modified), D (deleted), R (renamed), C (copied), or T (type changed)."
          examples:
            - M
          type: string
      required:
        - path
        - state
        - bytes
        - is_eof
      type: object
    GetBranchDiffResponse:
      additionalProperties: false
      description: Diff between a branch and its base, including merge base, aggregate stats, and per-file changes.
      properties:
        base:
          description: The base branch or ref used for comparison.
          examples:
            - main
          type: string
        branch:
          description: The branch name being diffed.
          examples:
            - feature/new-feature
          type: string
        files:
          description: Files returned with inline diff content.
          items:
            $ref: "#/components/schemas/FileDiff"
          type: array
        filtered_files:
          description: Files filtered out of inline diff output because of size or file-type rules.
          items:
            $ref: "#/components/schemas/FilteredFile"
          type: array
        merge_base_sha:
          description: Merge base SHA used for the three-dot branch diff.
          examples:
            - a2d127e6a4d54bb7390de828a99e36411f0c84df
          type: string
        stats:
          $ref: "#/components/schemas/DiffStats"
          description: Aggregate diff statistics.
      required:
        - branch
        - base
        - merge_base_sha
        - stats
        - files
        - filtered_files
      type: object
    GitCredential:
      additionalProperties: false
      description: Stored Git credential summary returned after a credential is created or updated.
      properties:
        created_at:
          description: Credential creation timestamp in ISO 8601 format.
          examples:
            - "2026-03-12T15:04:05Z"
          type: string
        id:
          description: Credential ID returned when the credential is created.
          examples:
            - ggc_1234567890abcdef
          type: string
      required:
        - id
      type: object
    GitIdentity:
      additionalProperties: false
      description: Author or committer identity for a commit.
      properties:
        email:
          description: Email address.
          examples:
            - review@example.com
          type: string
        name:
          description: Display name.
          examples:
            - Review Bot
          type: string
      required:
        - name
        - email
      type: object
    GitPushEvent:
      additionalProperties: false
      description: A Git ref update. The type field and the X-Pierre-Event header identify this payload as push.
      properties:
        after:
          description: The new commit SHA. All zeros for a deleted ref.
          type: string
        before:
          description: The previous commit SHA. All zeros for a newly created ref.
          type: string
        customer_id:
          deprecated: true
          description: "Deprecated: use org. The internal ID of the customer that owns the repository."
          type: string
        org:
          description: The organization name. It is the iss claim of the JWTs that the organization signs. It can be absent on older deliveries.
          type: string
        pushed_at:
          description: When the push occurred, as an RFC 3339 timestamp.
          format: date-time
          type: string
        ref:
          description: The full Git ref name, for example refs/heads/main.
          type: string
        repository:
          $ref: "#/components/schemas/WebhookRepository"
          description: The repository that produced the event.
        type:
          description: The event type. It matches the X-Pierre-Event header. It can be absent on older deliveries.
          enum:
            - push
          type: string
      required:
        - repository
        - ref
        - before
        - after
        - customer_id
        - pushed_at
      type: object
    GitSyncFailedEvent:
      additionalProperties: false
      description: Sent when a repository sync run fails, including failures after retries are exhausted and infrastructure failures. Internal cancellations do not produce this event. run_count includes the run that just finished.
      properties:
        completed_at:
          description: When the sync run finished, as an RFC 3339 timestamp. Absent on started events.
          format: date-time
          type: string
        error:
          description: The failure message. Absent unless the sync failed.
          type: string
        is_first_sync:
          description: Whether the repository had never synced successfully before this run began.
          type: boolean
        lifecycle_id:
          description: The sync lifecycle ID. It can be absent on older deliveries.
          type: string
        org:
          description: The organization name. It is the iss claim of the JWTs that the organization signs. It can be absent on older deliveries.
          type: string
        repository:
          $ref: "#/components/schemas/WebhookRepository"
          description: The repository that produced the event.
        run_count:
          description: Completed sync runs. For started events, this excludes the current run. For succeeded and failed events, it includes the current run.
          format: int64
          type: integer
        started_at:
          description: When the sync run began, as an RFC 3339 timestamp.
          format: date-time
          type: string
        type:
          description: The event type. It matches the X-Pierre-Event header.
          enum:
            - repo.sync.failed
          type: string
      required:
        - type
        - repository
        - run_count
        - is_first_sync
        - started_at
      type: object
    GitSyncStartedEvent:
      additionalProperties: false
      description: Sent when a repository sync run begins, before the upstream fetch starts. run_count counts previously completed runs.
      properties:
        completed_at:
          description: When the sync run finished, as an RFC 3339 timestamp. Absent on started events.
          format: date-time
          type: string
        error:
          description: The failure message. Absent unless the sync failed.
          type: string
        is_first_sync:
          description: Whether the repository had never synced successfully before this run began.
          type: boolean
        lifecycle_id:
          description: The sync lifecycle ID. It can be absent on older deliveries.
          type: string
        org:
          description: The organization name. It is the iss claim of the JWTs that the organization signs. It can be absent on older deliveries.
          type: string
        repository:
          $ref: "#/components/schemas/WebhookRepository"
          description: The repository that produced the event.
        run_count:
          description: Completed sync runs. For started events, this excludes the current run. For succeeded and failed events, it includes the current run.
          format: int64
          type: integer
        started_at:
          description: When the sync run began, as an RFC 3339 timestamp.
          format: date-time
          type: string
        type:
          description: The event type. It matches the X-Pierre-Event header.
          enum:
            - repo.sync.started
          type: string
      required:
        - type
        - repository
        - run_count
        - is_first_sync
        - started_at
      type: object
    GitSyncSucceededEvent:
      additionalProperties: false
      description: Sent when a repository sync run completes successfully. run_count includes the run that just finished.
      properties:
        completed_at:
          description: When the sync run finished, as an RFC 3339 timestamp. Absent on started events.
          format: date-time
          type: string
        error:
          description: The failure message. Absent unless the sync failed.
          type: string
        is_first_sync:
          description: Whether the repository had never synced successfully before this run began.
          type: boolean
        lifecycle_id:
          description: The sync lifecycle ID. It can be absent on older deliveries.
          type: string
        org:
          description: The organization name. It is the iss claim of the JWTs that the organization signs. It can be absent on older deliveries.
          type: string
        repository:
          $ref: "#/components/schemas/WebhookRepository"
          description: The repository that produced the event.
        run_count:
          description: Completed sync runs. For started events, this excludes the current run. For succeeded and failed events, it includes the current run.
          format: int64
          type: integer
        started_at:
          description: When the sync run began, as an RFC 3339 timestamp.
          format: date-time
          type: string
        type:
          description: The event type. It matches the X-Pierre-Event header.
          enum:
            - repo.sync.succeeded
          type: string
      required:
        - type
        - repository
        - run_count
        - is_first_sync
        - started_at
      type: object
    GrepContext:
      additionalProperties: false
      description: Number of context lines to return before and after each match.
      properties:
        after:
          description: Number of lines to include after each match.
          examples:
            - 1
          format: int32
          type: integer
        before:
          description: Number of lines to include before each match.
          examples:
            - 0
          format: int32
          type: integer
      type: object
    GrepFileFilters:
      additionalProperties: false
      description: Glob and extension filters that select the files to search.
      properties:
        exclude_globs:
          description: Glob patterns for files to exclude.
          items:
            description: Glob pattern such as `node_modules/**`.
            type: string
          type: array
        extension_filters:
          description: File extensions to filter by (e.g. [".js", ".py"]).
          items:
            description: File extension to match, including the leading dot (e.g. `.js`).
            type: string
          type: array
        include_globs:
          description: Glob patterns for files to include.
          items:
            description: Glob pattern such as `src/**/*.go`.
            type: string
          type: array
      type: object
    GrepFileMatch:
      additionalProperties: false
      description: Matches grouped under a single file path.
      properties:
        lines:
          description: Lines returned for the match, including optional context lines.
          items:
            $ref: "#/components/schemas/GrepLine"
          type: array
        path:
          description: Repository-relative file path that matched.
          examples:
            - app/blog/markdown/ephemeral-branches.md
          type: string
      required:
        - path
        - lines
      type: object
    GrepLimits:
      additionalProperties: false
      description: Limits on the total lines and on the matches for each file in a grep response.
      properties:
        max_lines:
          description: Maximum total lines to return (default 2000, max 2000).
          format: int32
          type: integer
        max_matches_per_file:
          description: Maximum matches returned per file (default 200).
          format: int32
          type: integer
      type: object
    GrepLine:
      additionalProperties: false
      description: Single line returned by grep, either a match or a surrounding context line.
      properties:
        line_number:
          description: Line number in the file.
          format: int32
          type: integer
        text:
          description: Line text content.
          type: string
        type:
          description: match for lines satisfying the pattern, or context for surrounding context lines.
          type: string
      required:
        - line_number
        - text
        - type
      type: object
    GrepPagination:
      additionalProperties: false
      description: Cursor and page size for grep matches.
      properties:
        cursor:
          description: Pagination cursor returned by a previous grep response.
          type: string
        limit:
          description: Maximum number of matches to return (default 200).
          examples:
            - 50
          format: int32
          type: integer
      type: object
    GrepQuery:
      additionalProperties: false
      description: Pattern to search for, and whether the search is case-sensitive.
      properties:
        case_sensitive:
          default: true
          description: Defaults to true when omitted.
          examples:
            - true
          type: boolean
        pattern:
          description: Regular expression or literal pattern to search for.
          examples:
            - ephemeral branches
          type: string
      required:
        - pattern
      type: object
    GrepResolvedQuery:
      additionalProperties: false
      description: Query settings that the server used for the search.
      properties:
        case_sensitive:
          description: Echoed case-sensitivity setting.
          examples:
            - true
          type: boolean
        pattern:
          description: Echoed pattern that was searched.
