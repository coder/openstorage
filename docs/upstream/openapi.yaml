      additionalProperties: false
      description: Merge request body specifying source and target branches, optional pinned source SHA, merge strategy, optional squash flag, and optional retry-on-target-move behavior, which is currently unsupported for GitHub-backed public targets.
      properties:
        allow_unrelated_histories:
          description: Permit merges between unrelated histories.
          type: boolean
        author:
          $ref: "#/components/schemas/GitIdentity"
          description: Author identity used when the backend creates a merge commit. Required for merge-commit strategies.
