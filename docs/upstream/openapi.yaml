  /api/repos/{repo_name}/restore-commit:
    post:
      description: |-
        Create a new commit that resets a branch back to a specific commit SHA while preserving normal Git history.

        Ref-level outcomes are reported in `result.status` and `result.success`, not by the status code alone, and failures raised by the restore itself come back in that same restore-result body. The problem-details schemas below describe gateway-level rejections such as `401`, `403` and `429`.

        Scope: `git:write` on the repository.
      operationId: repos-commits-restore
      parameters:
        - description: The repository name, for example `acme/web`.
          example: my-demo-repository
          in: path
          name: repo_name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/x-ndjson:
            example: |
              {"metadata":{"target_branch":"main","base_ref":"abc123def4567890abc123def4567890abc123de","expected_target_sha":"0123456789abcdef0123456789abcdef01234567","commit_message":"Reset branch","author":{"name":"Docs Bot","email":"docs@example.com"}}}
            schema:
              contentSchema:
                maxItems: 1
                minItems: 1
                prefixItems:
                  - additionalProperties: false
                    properties:
                      metadata:
                        $ref: "#/components/schemas/ReposCommitsRestoreRequest"
                    required:
                      - metadata
                    type: object
                type: array
              description: NDJSON stream containing one `metadata` object.
              type: string
        description: Send a single NDJSON metadata line describing the branch to restore and the commit SHA to restore it to.
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReposCommitsRestoreResponse"
          description: Restore commit created successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Conflict
        "412":
          content:
            application/json:
              example:
                commit: null
                result:
                  message: branch already matches target commit
                  new_sha: ""
                  old_sha: ""
                  status: precondition_failed
                  success: false
                  target_branch: ""
              schema:
                $ref: "#/components/schemas/ReposCommitsRestoreResponse"
          description: "Storage rejected the restore because the branch cannot move as requested: the branch already points at `base_ref`, the restore would produce no change, or `base_ref` is not an ancestor of the current tip. The body carries the restore result with `result.status` set to `precondition_failed`."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Too Many Requests
          headers:
            RateLimit:
              description: Current IETF service-limit field. `r=0` means no request is immediately available; `t` is the effective window in seconds before capacity is expected to return.
              schema:
                type: string
            Retry-After:
              description: Minimum delay before retrying, expressed as seconds or an HTTP date. This value takes precedence over the `RateLimit` effective window.
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Service Unavailable
      security:
        - bearerAuth:
            - git:write
      summary: Restore Commit
      tags:
        - Commits
      x-permission-scopes:
        - git:write
      x-requires-repo-scope: true
      x-stability: stable
