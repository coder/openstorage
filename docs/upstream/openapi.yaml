    patch:
      description: |-
        Change the default branch of a repository.

        The gateway reads the current `HEAD` symbolic ref, then repoints it at the requested branch through a transactional compare-and-swap against that value, and finally records the new default branch in the repository row. Branch names are fully qualified for you: `main` is written as the symref target `refs/heads/main`, and a value that already starts with `refs/` is used verbatim. The branch itself is not created by this call.

        Scope: `repo:write` on the repository.
      operationId: repos-update
      parameters:
        - description: The repository name, for example `acme/web`.
          example: my-demo-repository
          in: path
          name: repo_name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              default_branch: main
            schema:
              $ref: "#/components/schemas/ReposUpdateRequest"
        description: Repository settings to change. `default_branch` is the only supported field and must be a non-empty branch name.
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                default_branch: main
                repo_name: pierre/sdk-documentation
              schema:
                $ref: "#/components/schemas/ReposUpdateResponse"
          description: Default branch updated. Returns the repository ID, its URL path, and the branch name now recorded as the default.
        "400":
          content:
            application/json:
              example:
                code: bad_request
                detail: default_branch must be a string
                error: default_branch must be a string
                invalid_params:
                  - name: default_branch
                    reason: must be a string
                status: 400
                title: Bad Request
                type: about:blank
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
            application/problem+json:
              example:
                code: bad_request
                detail: default_branch must be a string
                error: default_branch must be a string
                invalid_params:
                  - name: default_branch
                    reason: must be a string
                status: 400
                title: Bad Request
                type: about:blank
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
          description: The body could not be decoded as JSON, a field was not valid, or `default_branch` was missing or empty. `invalid_params` names each invalid field.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: No repository matching the JWT `repo` claim exists for this organisation.
        "409":
          content:
            application/json:
              example:
                code: conflict
                detail: default branch was modified concurrently, please retry
                error: default branch was modified concurrently, please retry
                instance: /api/repos/my-demo-repository
                status: 409
                title: Conflict
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              example:
                code: conflict
                detail: default branch was modified concurrently, please retry
                error: default branch was modified concurrently, please retry
                instance: /api/repos/my-demo-repository
                status: 409
                title: Conflict
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: "`HEAD` moved between the read and the compare-and-swap, so the update was rejected. Retry the request."
        "429":
