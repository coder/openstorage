  /api/repos/{repo_name}/merge:
    post:
      description: |-
        Merge changes between branches without cloning the repository or shelling out to Git. This endpoint also supports promoting work from ephemeral branches into long-lived branches such as `main`. Omit `expected_target_sha` to merge into the current target tip and allow the gateway to retry stale target/repository movement internally; set `expected_target_sha` to require a strict target-tip precondition. GitHub-backed public targets currently do not use automatic retry.

        Scope: `git:write` on the repository.
      operationId: repos-merge
      parameters:
        - description: The repository name, for example `acme/web`.
          example: my-demo-repository
          in: path
          name: repo_name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              author:
                email: review@example.com
                name: Review Bot
              commit_message: Merge feature/preview
              committer:
                email: review@example.com
                name: Review Bot
              expected_target_sha: c4f0fdfc41adab56630b34f5f4fd4e84a2c5b4d2
              source_is_ephemeral: true
              source_ref: feature/preview
              squash: false
              strategy: merge
              target_branch: main
            schema:
              $ref: "#/components/schemas/ReposMergeRequest"
        description: Merge a source branch into a target branch using a merge commit, fast-forward only, or fast-forward preferred behaviour. Source and target can live in the default or ephemeral namespace. When expected_target_sha is omitted, the gateway may retry stale target updates internally while keeping the originally resolved source commit pinned. Automatic stale-target retry is disabled for GitHub-backed public targets.
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                commit_sha: 41f0d5c6cc5f4d0fb4a3af2de27ccf9a80ab3b84
                merge_base_sha: a2d127e6a4d54bb7390de828a99e36411f0c84df
                promoted_commits: 3
                result: merged
                source:
                  ephemeral: true
                  ref: feature/preview
                  sha: 9eb378bdb5bf1944f6ba0bd5a2c4df3ce32f4df1
                target:
                  branch: main
                  new_sha: 41f0d5c6cc5f4d0fb4a3af2de27ccf9a80ab3b84
                  old_sha: c4f0fdfc41adab56630b34f5f4fd4e84a2c5b4d2
                tree_sha: b9532c5d5be50d88e2f45d7c229566b2f1f99731
              schema:
                $ref: "#/components/schemas/ReposMergeResponse"
          description: Merge result, including the source and target commit state after the operation.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Not Found
        "409":
          content:
            application/json:
              example:
                conflict_type: merge_conflict
                error: merge conflict
              schema:
                $ref: "#/components/schemas/MergeConflict"
          description: The merge could not be completed because of file-level conflicts, or an automatic stale-target retry could not absorb concurrent target/repository movement. Inspect conflict_type to distinguish merge_conflict, target_moved, and repo_changed.
        "429":
