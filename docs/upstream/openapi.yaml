        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReposCommitsRestoreResponse"
          description: Restore commit created and the branch reset. This is the status a successful reset returns.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Bad Request
        "401":
          content:
            application/json:
