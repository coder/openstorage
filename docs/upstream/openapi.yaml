            - main
          type: string
      type: object
    ReposUpdateResponse:
      additionalProperties: false
      description: Repository state after applying the patch.
      properties:
        default_branch:
          description: Updated default branch name.
          examples:
            - main
          type: string
        id:
          deprecated: true
          description: "Deprecated: use repo_name. Stable repository identifier."
          examples:
            - repo_7f2b3d9
          type: string
        repo_id:
          deprecated: true
          description: "Deprecated: use repo_name. Stable repository identifier."
          examples:
            - repo_7f2b3d9
          type: string
        repo_name:
          description: Repository name or path. It can contain a slash. It matches the JWT repo claim.
          examples:
            - pierre/sdk-documentation
          type: string
        url:
          deprecated: true
          description: "Deprecated: use repo_name. Repository name or path, not a full URL."
          examples:
            - pierre/sdk-documentation
          type: string
      required:
        - repo_id
        - id
        - repo_name
        - url
        - default_branch
      type: object
    ReposUpstreamDeleteResponse:
      additionalProperties: false
      description: Confirmation that the upstream link has been detached from the repository.
      properties:
        message:
          description: Human-readable detach status message.
          examples:
            - repository detached
          type: string
      required:
        - message
      type: object
    ReposUpstreamPullRequest:
      additionalProperties: false
      description: Optional parameters for triggering a sync from the configured upstream.
      properties:
        after:
          description: Optional opaque token from a previous pull-upstream response. Reserved for compatibility with future incremental syncs.
          type: string
        ref:
          description: Optional branch or tag to pull from the configured upstream. Defaults to the repository's tracked default branch.
          examples:
            - main
          type: string
      type: object
    ReposUpstreamPullResponse:
      additionalProperties: false
      description: Acknowledgement that an upstream sync has been initiated; the sync itself runs asynchronously.
      properties:
        message:
          description: Human-readable status message.
          examples:
            - Repository sync initiated successfully
          type: string
      required:
        - message
      type: object
    Repository:
      additionalProperties: false
      description: A repository, including its Git Sync upstream when one is configured.
      properties:
        base_repo:
          $ref: "#/components/schemas/UpstreamRepo"
          deprecated: true
          description: "Deprecated: use upstream. The upstream of the repository, when it has one."
        created_at:
          description: ISO 8601 creation timestamp.
          examples:
            - "2024-01-15T10:30:00Z"
          type: string
        default_branch:
          description: Default branch name.
          examples:
            - main
          type: string
        repo_id:
          deprecated: true
          description: "Deprecated: use repo_name. Stable repository identifier."
          examples:
            - repo_7f2b3d9
          type: string
        repo_name:
          description: Repository name or path. It can contain a slash. It matches the JWT repo claim.
          examples:
            - team/project-alpha
          type: string
        upstream:
          $ref: "#/components/schemas/UpstreamRepo"
          description: External Git host that the repository keeps syncing from. Absent when the repository has no upstream.
        url:
          deprecated: true
          description: "Deprecated: use repo_name. Repository name or path, not a full URL."
          examples:
            - team/project-alpha
          type: string
      required:
        - repo_id
        - repo_name
        - url
        - default_branch
        - created_at
      type: object
    RestoredCommit:
      additionalProperties: false
      description: Commit object generated by a restore-commit operation.
      properties:
        commit_sha:
          description: SHA of the new restore commit.
          type: string
        pack_bytes:
          description: Size of the generated pack in bytes.
          format: int64
          minimum: 0
          type: integer
        target_branch:
          description: Branch that was reset.
          type: string
        tree_sha:
          description: Tree SHA of the restore commit.
          type: string
      required:
        - commit_sha
        - tree_sha
        - target_branch
        - pack_bytes
      type: object
    Tag:
      description: A tag.
      properties:
        name:
          description: Tag name.
          examples:
            - v1.0.0
          type: string
        sha:
          description: Dereferenced commit SHA for the tag.
          examples:
            - a1b2c3d4e5f6
          type: string
      required:
        - name
        - sha
      type: object
    TagListItem:
      allOf:
        - $ref: "#/components/schemas/Tag"
        - properties:
            cursor:
              description: Opaque pagination token for this tag entry.
              examples:
                - t_abc123
              type: string
          required:
            - cursor
          type: object
      description: A tag in a list, with its pagination cursor.
      type: object
    UpstreamConfig:
      additionalProperties: false
      description: External Git host that a new repository keeps syncing from.
      properties:
        access:
          description: GitHub only. app (the default) reads through the GitHub App installation of the organization. public mirrors a public repository without an installation, and syncs only on request.
          enum:
            - app
            - public
          type: string
        host:
          description: Bare hostname of a self-hosted provider, such as gitlab.example.com. It defaults to the public host of the provider.
          type: string
        name:
          description: Repository name on the upstream provider.
          examples:
            - hello-world
          type: string
        owner:
          description: Repository owner or namespace on the upstream provider.
          examples:
            - octocat
          type: string
        provider:
          description: External Git host of the upstream repository.
          enum:
            - github
            - gitlab
            - bitbucket
            - gitea
            - forgejo
            - codeberg
            - sr.ht
            - sourcehut
          type: string
      required:
        - provider
        - owner
        - name
      type: object
    UpstreamRepo:
      additionalProperties: false
      description: Git Sync upstream of a repository.
      properties:
        name:
          description: Upstream repository name.
          examples:
            - Hello-World
          type: string
        owner:
          description: Upstream repository owner or namespace.
          examples:
            - octocat
          type: string
        provider:
          description: Upstream provider name.
          examples:
            - github
          type: string
      required:
        - provider
      type: object
    ValidationProblemDetails:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - properties:
            invalid_params:
              description: The invalid fields of the request body, one item for each field. The response leaves it out when the server cannot name the field, for example when the body is not valid JSON.
              items:
                $ref: "#/components/schemas/InvalidParam"
              type: array
          type: object
      description: Problem details of a request body that is not valid. `invalid_params` names each invalid field.
      type: object
    WebhookRepository:
      additionalProperties: false
      description: The repository that produced the event.
      properties:
        id:
          description: The internal repository ID.
          type: string
        repo_name:
          description: The repository name, for example team/project. It can be absent on older deliveries.
          type: string
        url:
          deprecated: true
          description: "Deprecated: use repo_name, which has the same value. The repository name, for example team/project."
          type: string
      required:
        - id
        - url
      type: object
    WrittenCommit:
      additionalProperties: false
      description: Commit object information generated when a pack is applied.
      properties:
        blob_count:
          description: Number of blobs included in the pack.
          format: int32
          minimum: 0
          type: integer
        commit_sha:
          description: SHA of the new commit.
          type: string
        pack_bytes:
          description: Size of the generated pack in bytes.
          format: int64
          minimum: 0
          type: integer
        target_branch:
          description: Branch the commit was written to.
          type: string
        tree_sha:
          description: Tree SHA of the new commit.
          type: string
      required:
        - commit_sha
        - tree_sha
        - target_branch
        - pack_bytes
        - blob_count
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: "JWT bearer token signed with your organization's registered signing key. There is no OAuth authorization server; you mint tokens yourself and the token's `scopes` claim carries the granted permission scopes. Public scopes: `git:read` (read repository contents), `git:write` (write branches, commits, tags, and notes), `repo:write` (create and manage repositories), `org:read` (list an organization's repositories). Each operation's security requirement names the scopes it requires. See https://code.storage/docs/getting-started/authentication for how to mint tokens."
      scheme: bearer
      type: http
info:
  description: |-
    The Code Storage HTTP API exposes repository management, Git reads, and write workflows over plain HTTPS.

    ## Authentication

    Send a signed JWT in the `Authorization: Bearer <token>` header on every request.

    - Organisation-scoped endpoints such as `GET /api/repos` require organisation scopes like `org:read`
    - Repository-scoped endpoints require a JWT whose `repo` claim names the target repository
    - Write operations require the relevant scope such as `git:write` or `repo:write`

    ## Pagination

    List endpoints use cursor-based pagination.

    - `cursor` is an opaque token returned by the previous response
    - `limit` defaults to `20` and is capped per endpoint
    - `has_more` tells you whether another request is available
    - `next_cursor` becomes the next `cursor` value

    ## Paths

    Preferred routes use the shorter `/api/...` form. Legacy `/api/v1/...` aliases remain documented where they are still supported and are marked as deprecated when a preferred route exists.

    ## Repository names in paths

    - Names containing `/` (or any other character that is not safe in a URL path segment) **must** be URL encoded so the value occupies a single path segment. For example, `pierre/example` becomes `pierre%2Fexample` and the request URL is `/api/repos/pierre%2Fexample/...`.
    - Plain names that contain only URL-safe characters can be sent as-is: `/api/repos/dotfiles/...`.
    - The server URL-decodes the value before resolving the repository, so double-encoding is not required.

    ## Errors

    Most endpoints return RFC 9457-compatible problem details under `application/problem+json`, with a legacy `error` field mirrored from `detail`. Each problem body has a stable, snake_case `code`. Branch on `code`, not on `detail`. The Error codes section lists the values.

    A `400 Bad Request` response for a request body can name the invalid fields in `invalid_params`. Each item has the dotted path of the field in `name`, for example `deployment.production_branch`, and the rule that the value breaks in `reason`.

    A `429 Too Many Requests` response carries the current IETF `RateLimit` service-limit field and `Retry-After`. `RateLimit` reports immediately available quota (`r`) and its effective window in seconds (`t`); `Retry-After` is the minimum delay and takes precedence. The gateway's capacity is dynamic, so it does not advertise a fixed `RateLimit-Policy` on successful responses.

    Streaming commit and note workflows may return operation-specific failure bodies so callers can inspect partial results, branch state, or workflow status without parsing generic error strings.

    ## Error codes

    Each problem body has a stable `code`. Each status has a generic code. A specific code replaces it when the caller must take a different action. New codes can be added. Treat an unknown code as the generic code for its status.

    Generic codes: `bad_request` (400), `unauthorized` (401), `forbidden` (403), `not_found` (404), `method_not_allowed` (405), `request_timeout` (408), `conflict` (409), `precondition_failed` (412), `payload_too_large` (413), `unprocessable_entity` (422), `rate_limited` (429), `request_canceled` (499), `internal_error` (500), `not_implemented` (501), `bad_gateway` (502), `service_unavailable` (503), `gateway_timeout` (504). Any other status uses its status text in snake_case.

    Specific codes:

    - `authentication_unavailable` (403): the server cannot verify credentials now; retry.
    - `insufficient_scope` (403): the token does not have a scope that the operation requires.
    - `repo_claim_missing` (400): the token has no `repo` claim.
    - `repo_name_mismatch` (400): the request `repo_name` does not match the token `repo` claim.
    - `route_not_found` (404): no API route matches the path.
    - `repository_not_found` (404): the repository does not exist or the token cannot access it.
    - `repository_deleted` (409): the repository is already deleted.
    - `repository_thawing` (409): the repository is being restored from cold storage; retry after `Retry-After`.
    - `sync_in_progress` (409): an upstream sync is in progress; retry.
    - `upstream_already_configured` (409): the repository already has an upstream.
    - `branch_not_found` (404): the branch does not exist.
    - `ref_not_found` (404): the ref or revision does not exist.
    - `merge_conflict` (409): the merge has file conflicts.
    - `credential_not_found` (404): the Git credential does not exist.
    - `credential_exists` (409): the repository already has a Git credential.
    - `github_app_not_configured` (412): the organization does not have exactly one GitHub App.
    - `github_repository_inaccessible` (412, or the 4xx status from the upstream): GitHub does not give access to the upstream repository.
    - `hosting_not_enabled` (403): hosting is not enabled for the organization.
    - `hosting_project_not_found` (404): the repository has no hosting project.
    - `deployment_not_found` (404): the deployment does not exist.
    - `deployment_project_name_in_use` (409): another repository uses the hosting project name.
    - `idempotency_key_reused` (422): the idempotency key belongs to a different request.
  title: code.storage
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/meta:
    get:
      description: |-
        Return the cloud provider, region, and public inbound IP addresses of the Code Storage cluster that serves the current organisation. Addresses are listed separately for Git over HTTPS and for the HTTP API; allow them in firewall rules that restrict outbound traffic to Code Storage. The lists change when the cluster's ingress changes, so poll this endpoint rather than copying them once.

        Scope: `org:read`.
      operationId: meta-get
      responses:
        "200":
          content:
            application/json:
              example:
                ips:
                  api:
                    - 192.0.2.0/24
                  git:
                    - 192.0.2.0/24
                provider:
                  name: aws
                  region: us-east-2
              schema:
                $ref: "#/components/schemas/Meta"
          description: Cloud location and inbound IP addresses of the cluster that serves the organisation.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Conflict
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Too Many Requests
          headers:
            RateLimit:
              description: Current IETF service-limit field. `r=0` means no request is immediately available; `t` is the effective window in seconds before capacity is expected to return.
              schema:
                type: string
            Retry-After:
              description: Minimum delay before retrying, expressed as seconds or an HTTP date. This value takes precedence over the `RateLimit` effective window.
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Service Unavailable
      security:
        - bearerAuth:
            - org:read
      summary: Get Organization Metadata
      tags:
        - Organization
      x-permission-scopes:
        - org:read
      x-requires-repo-scope: false
      x-stability: stable
  /api/repos:
    get:
      description: |-
        List repositories for the current organisation with cursor-based pagination. Supply `q` to filter results by a case-insensitive substring match against `repo_name` (for example `pierre/sdk-documentation`).

        Scope: `org:read`.
      operationId: repos-list
      parameters:
        - description: Case-insensitive substring to match against `repo_name`. Trimmed before matching. When omitted or empty after trimming, the full repository list is returned.
          example: sdk
          in: query
          name: q
          schema:
            type: string
        - description: Pagination cursor from previous response (base64 encoded)
          example: MTcwNzU3MzQ1MTAwMDAwMDAwMHxyZXBvXzlhNGMyMWY
          in: query
          name: cursor
          schema:
            type: string
        - description: Maximum number of repositories to return. Defaults to 20 and is capped at 100.
          example: 20
          in: query
          name: limit
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              example:
                has_more: true
                next_cursor: MTcwNzU3MzQ1MTAwMDAwMDAwMHxyZXBvXzlhNGMyMWY
                repos:
                  - created_at: "2024-01-15T10:30:00Z"
                    default_branch: main
                    repo_name: team/project-alpha
                    upstream:
                      name: Hello-World
                      owner: octocat
                      provider: github
              schema:
                $ref: "#/components/schemas/ReposListResponse"
          description: A paginated view of repositories in the organisation.
        "400":
          content:
            application/json:
              example:
                code: bad_request
                detail: invalid cursor
                error: invalid cursor
                instance: /api/repos
                status: 400
                title: Bad Request
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              example:
                code: bad_request
                detail: invalid cursor
                error: invalid cursor
                instance: /api/repos
                status: 400
                title: Bad Request
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: The supplied pagination cursor could not be decoded.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Conflict
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Too Many Requests
          headers:
            RateLimit:
              description: Current IETF service-limit field. `r=0` means no request is immediately available; `t` is the effective window in seconds before capacity is expected to return.
              schema:
                type: string
            Retry-After:
              description: Minimum delay before retrying, expressed as seconds or an HTTP date. This value takes precedence over the `RateLimit` effective window.
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Service Unavailable
      security:
        - bearerAuth:
            - org:read
      summary: List Repos
      tags:
        - Repositories
      x-permission-scopes:
        - org:read
      x-requires-repo-scope: false
      x-stability: stable
    post:
      description: |-
        Create a repository.

        A repository starts empty or from a source. `base_repo` is a one-time copy of a Code Storage repository; `upstream` is a lasting link to an external Git host. A copy takes the history of one commit (`base_repo.ref`, or the source HEAD) into one branch, and keeps no link to its source. A sync keeps its upstream, and the repository can sync from it again. Set at most one of the two.

        Create is idempotent on the repository name. A new repository returns `201`. When the name already exists, the request returns `200`, and a copy copies nothing. When the name exists with a different upstream, the request returns `409`.

        The deprecated form of `base_repo`, with `provider` and `operation`, still works.

        Scope: `repo:write` on the repository.
      operationId: repos-create
      parameters:
        - deprecated: true
          description: "Deprecated: use the default_branch body field instead. Default branch for the new repository. When the body also has default_branch, the body value wins."
          in: query
          name: default_branch
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              base_repo:
                auth:
                  token: SOURCE_REPO_READ_TOKEN
                name: pierre/sdk-documentation
                ref: main
              default_branch: feature-preview
              repo_name: pierre/docs-copy
            examples:
              copy:
                description: Create an independent repository from one commit of another Code Storage repository.
                summary: Copy
                value:
                  base_repo:
                    auth:
                      token: SOURCE_REPO_READ_TOKEN
                    name: pierre/sdk-documentation
                    ref: main
                  default_branch: feature-preview
                  repo_name: pierre/docs-copy
              empty_repo:
                description: Create a new repository with an explicit default branch.
                summary: Empty repository
                value:
                  default_branch: main
                  repo_name: pierre/my-repo
              generic_git_sync:
                description: Mirror a repository from a generic HTTPS Git provider such as GitLab, Bitbucket, Gitea, or Forgejo.
                summary: Generic HTTPS Git sync
                value:
                  default_branch: main
                  repo_name: pierre/repo-name
                  upstream:
                    host: git.example.com
                    name: repo-name
                    owner: org-name
                    provider: gitea
              public_github_sync:
                description: Mirror a public GitHub repository without a GitHub App installation.
                summary: Public GitHub sync
                value:
                  default_branch: main
                  repo_name: pierre/hello-world
                  upstream:
                    access: public
                    name: hello-world
                    owner: octocat
                    provider: github
            schema:
              $ref: "#/components/schemas/ReposCreateRequest"
        description: Create an empty repository, a copy of a Code Storage repository (`base_repo`), or a repository that syncs from an external Git host (`upstream`).
      responses:
        "200":
          content:
            application/json:
              example:
                message: Repository 'pierre/sdk-documentation' already exists
                repo_name: pierre/sdk-documentation
              schema:
                $ref: "#/components/schemas/ReposCreateResponse"
          description: The repository already existed, and the request created nothing.
        "201":
          content:
            application/json:
              example:
                message: Repository 'pierre/sdk-documentation' created
                repo_name: pierre/sdk-documentation
              schema:
                $ref: "#/components/schemas/ReposCreateResponse"
          description: The request created the repository.
        "400":
          content:
            application/json:
              example:
                code: bad_request
                detail: base_repo and upstream cannot both be set. Use base_repo to copy a Code Storage repository, or upstream to sync from an external Git host.
                error: base_repo and upstream cannot both be set. Use base_repo to copy a Code Storage repository, or upstream to sync from an external Git host.
                instance: /api/repos
                status: 400
                title: Bad Request
                type: about:blank
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
            application/problem+json:
              example:
                code: bad_request
                detail: base_repo and upstream cannot both be set. Use base_repo to copy a Code Storage repository, or upstream to sync from an external Git host.
                error: base_repo and upstream cannot both be set. Use base_repo to copy a Code Storage repository, or upstream to sync from an external Git host.
                instance: /api/repos
                status: 400
                title: Bad Request
                type: about:blank
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
          description: The repository name was invalid or did not match the JWT repo claim, the request set both base_repo and upstream, or the source was invalid. `invalid_params` names each invalid field of the body.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
