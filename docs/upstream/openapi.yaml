            type: string
        - description: Whether `ref` should be resolved from the ephemeral namespace.
          example: true
          in: query
          name: ephemeral
          schema:
            type: boolean
        - description: Standard HTTP byte-range header (`bytes=<start>-<end>`). Triggers a `206 Partial Content` response.
          in: header
          name: Range
          schema:
            type: string
        - description: "Conditional range request: when the supplied validator matches `ETag` or `Last-Modified`, the server returns `206 Partial Content`; otherwise the full body is returned with `200 OK`."
          in: header
          name: If-Range
          schema:
            type: string
        - description: Returns `412 Precondition Failed` when the current `ETag` does not match.
          in: header
          name: If-Match
          schema:
            type: string
        - description: Returns `304 Not Modified` when the current `ETag` matches.
          in: header
          name: If-None-Match
          schema:
            type: string
        - description: Returns `304 Not Modified` when `Last-Modified` is on or before this date.
          in: header
          name: If-Modified-Since
          schema:
            type: string
        - description: Returns `412 Precondition Failed` when `Last-Modified` is after this date.
          in: header
          name: If-Unmodified-Since
          schema:
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                description: Raw file bytes exactly as stored in the Git blob. No transcoding or encoding is applied.
                format: binary
                type: string
          description: File content returned.
          headers:
            Accept-Ranges:
              description: Set to `bytes`; the endpoint accepts byte-range requests via `Range`.
              schema:
                type: string
            Content-Length:
              description: Full blob size in bytes for 200 responses, or range size for 206 responses.
              schema:
                type: string
            Content-Range:
              description: Returned for 206 responses; identifies the byte range served.
              schema:
                type: string
            Content-Type:
              description: Always `application/octet-stream`.
              schema:
                type: string
            ETag:
              description: Strong validator equal to the quoted blob object SHA. Use with `If-Match` / `If-None-Match`.
              schema:
                type: string
            Last-Modified:
              description: Committer date of the most recent commit reachable from `ref` that modified `path`. Use with `If-Modified-Since` / `If-Unmodified-Since`.
              schema:
                type: string
            X-Blob-Sha:
              description: Git blob object SHA of the served file.
              schema:
                type: string
            X-Last-Commit-Sha:
              description: SHA of the most recent commit reachable from `ref` that modified `path`.
              schema:
                type: string
        "206":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                description: The requested slice of the raw file bytes. `Content-Range` identifies which bytes were served.
                format: binary
                type: string
          description: Byte range satisfied. Body contains only the requested bytes; `Content-Range` identifies the range.
          headers:
            Accept-Ranges:
              description: Set to `bytes`; the endpoint accepts byte-range requests via `Range`.
              schema:
                type: string
            Content-Length:
              description: Full blob size in bytes for 200 responses, or range size for 206 responses.
              schema:
                type: string
            Content-Range:
              description: Returned for 206 responses; identifies the byte range served.
              schema:
                type: string
            Content-Type:
              description: Always `application/octet-stream`.
              schema:
                type: string
            ETag:
              description: Strong validator equal to the quoted blob object SHA. Use with `If-Match` / `If-None-Match`.
              schema:
