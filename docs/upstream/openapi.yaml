  /api/repos/{repo_name}/files:
    get:
      description: |-
        List files or direct child entries at a branch, tag, or commit without cloning the repository. Each entry includes its path, Git mode, and derived type (`blob`, `tree`, `symlink`, or `submodule`). Trees no longer carry a trailing `/`; branch on `type` instead.

        Scope: `git:read` on the repository.
      operationId: repos-files-list
      parameters:
        - description: The repository name, for example `acme/web`.
          example: my-demo-repository
          in: path
          name: repo_name
          required: true
          schema:
            type: string
        - description: Optional branch, tag, or commit SHA to list from. When omitted, the repository default branch is used.
          example: main
          in: query
          name: ref
          schema:
            type: string
        - description: Optional repository-relative subtree to list. Empty means the repository root.
          example: docs
          in: query
          name: path
          schema:
            type: string
        - description: When true, include descendants recursively. When false, only direct children are returned.
          example: false
          in: query
          name: recursive
          schema:
            type: boolean
        - description: Pagination cursor returned by a previous `list_files` response.
          example: docs/guide.md
          in: query
          name: cursor
          schema:
            type: string
        - description: Maximum number of paths to return. Defaults to 1000.
          example: 1000
          in: query
          name: limit
          schema:
            default: 1000
            maximum: 5000
            minimum: 0
            type: integer
        - description: Whether `ref` should be resolved from the ephemeral namespace.
          example: true
          in: query
          name: ephemeral
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              example:
                entries:
                  - mode: "100644"
                    path: src/main.go
                    type: blob
                has_more: true
                next_cursor: MTcwNzU3MzQ1MTAwMDAwMDAwMHxyZXBvXzlhNGMyMWY
                paths:
                  - README.md
                ref: main
              schema:
                $ref: "#/components/schemas/ReposFilesListResponse"
          description: Tree entries for the resolved revision.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
